name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} · ${{ matrix.db }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 22, db: 'mariadb:10.11', experimental: false }
          - { node: 20, db: 'mariadb:10.11', experimental: false }
          - { node: 22, db: 'mariadb:11.4', experimental: true }
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      pg:
        image: postgres:16
        env:
          POSTGRES_USER: dbc
          POSTGRES_PASSWORD: dbcpass
          POSTGRES_DB: dbc_pg
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U dbc" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 3306
      TEST_DB_USER: root
      TEST_DB_PASS: root
      TEST_BIG_ROWS: 100000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - run: npm ci
      - run: npm test
