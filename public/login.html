<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · DB Console</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<style>
  :root{
    --bg:#f6f7f9;
    --card:#ffffff;
    --border:#e7e9ee;
    --text:#1f2430;
    --muted:#767c8c;
    --accent:#4a5df9;
    --accent-hover:#3c4fe0;
  }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
  }
  .auth-card{
    width:100%;
    max-width:380px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:0 4px 24px rgba(20,20,43,.05);
  }
  .brand-icon{
    width:44px;height:44px;
    border-radius:12px;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:1.2rem;
  }
  .form-control{
    border-color:var(--border);
    padding:.6rem .8rem;
  }
  .form-control:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 .2rem rgba(74,93,249,.15);
  }
  .btn-accent{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:600;
    padding:.6rem 1rem;
    border-radius:10px;
  }
  .btn-accent:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:#fff;}
  [x-cloak]{display:none!important}
</style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
<div class="auth-card p-4 p-md-5" x-data="loginForm()">
  <div class="d-flex flex-column align-items-center mb-4">
    <div class="brand-icon mb-3"><i class="bi bi-hdd-network"></i></div>
    <h1 class="h5 mb-1 fw-semibold">DB Console</h1>
    <p class="text-muted small mb-0">Sign in to manage your databases</p>
  </div>

  <div class="alert alert-danger py-2 small" x-show="error" x-text="error" x-cloak></div>

  <div x-show="step === 'password' && sso" x-cloak class="mb-3">
    <a href="/auth/oidc/login" class="btn btn-outline-secondary w-100"><i class="bi bi-box-arrow-in-right me-1"></i>Sign in with <span x-text="sso && sso.label"></span></a>
    <div class="text-center text-muted small my-3">or with a password</div>
  </div>

  <form @submit.prevent="submit" x-show="step === 'password'">
    <div class="mb-3">
      <label class="form-label small fw-medium">Username</label>
      <input type="text" class="form-control" x-model="username" autofocus required>
    </div>
    <div class="mb-4">
      <label class="form-label small fw-medium">Password</label>
      <input type="password" class="form-control" x-model="password" required>
    </div>
    <button type="submit" class="btn btn-accent w-100" :disabled="loading">
      <span x-show="loading" class="spinner-border spinner-border-sm me-1"></span>
      Sign in
    </button>
  </form>
  <div class="text-muted small text-center mt-3" x-show="ldap && step === 'password'" x-cloak>Directory users: sign in with your <span x-text="ldap && ldap.label"></span> username and password.</div>

  <form @submit.prevent="submitCode" x-show="step === 'code'" x-cloak>
    <p class="small text-muted">Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p>
    <div class="mb-4">
      <input type="text" class="form-control text-center" style="letter-spacing:.2em; font-size:1.2rem" x-model="code" x-ref="code" autocomplete="one-time-code" inputmode="text" placeholder="123456" required>
    </div>
    <button type="submit" class="btn btn-accent w-100" :disabled="loading">
      <span x-show="loading" class="spinner-border spinner-border-sm me-1"></span>
      Verify
    </button>
    <button type="button" class="btn btn-link btn-sm w-100 mt-2" @click="step = 'password'; code = ''; error = ''">Start over</button>
  </form>
</div>

<script>
function loginForm() {
  return {
    username: '',
    password: '',
    sso: null,
    ldap: null,
    code: '',
    step: 'password',
    error: '',
    loading: false,
    async init() {
      const q = new URLSearchParams(location.search);
      if (q.get('error')) this.error = q.get('error');
      try { const cfg = await (await fetch('/api/auth-config')).json(); this.sso = cfg.oidc; this.ldap = cfg.ldap; } catch (e) { /* password sign-in still works */ }
    },
    async submit() {
      this.error = '';
      this.loading = true;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: this.username, password: this.password })
        });
        const data = await res.json();
        if (!res.ok) {
          this.error = data.error || 'Login failed';
        } else if (data.need2fa) {
          this.step = 'code'; this.password = '';
          this.$nextTick(() => this.$refs.code && this.$refs.code.focus());
        } else {
          window.location.href = '/';
        }
      } catch (e) {
        this.error = 'Network error, please try again';
      } finally {
        this.loading = false;
      }
    },
    async submitCode() {
      this.error = '';
      this.loading = true;
      try {
        const res = await fetch('/api/login/2fa', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: this.code }) });
        const data = await res.json();
        if (!res.ok) {
          this.error = data.error || 'Verification failed';
          if (data.expired) this.step = 'password';
          this.code = '';
        } else window.location.href = '/';
      } catch (e) {
        this.error = 'Network error, please try again';
      } finally {
        this.loading = false;
      }
    }
  };
}
</script>
</body>
</html>
