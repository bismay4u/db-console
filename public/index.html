    sortByColumn(col) {
      if (this.exploreSortCol === col) {
        this.exploreSortDir = this.exploreSortDir === 'asc' ? 'desc' : 'asc';
      } else {
        this.exploreSortCol = col; this.exploreSortDir = 'asc';
      }
      this.explorePage = 1;
      this.loadExploreRows();
    },
    exploreMaxPage() {
      return Math.max(1, Math.ceil(this.exploreTotal / this.explorePageSize));
    },
    changePage(delta) {
      const next = Math.min(Math.max(1, this.explorePage + delta), this.exploreMaxPage());
      if (next === this.explorePage) return;
      this.explorePage = next;
      this.loadExploreRows();
    },
    changePageSize(size) {
      this.explorePageSize = Number(size);
      this.explorePage = 1;
      this.loadExploreRows();
    },
    canEditRows() {
      return !this.exploreIsView() && Array.isArray(this.explorePrimaryKey) && this.explorePrimaryKey.length > 0;
    },
    openEditRow(row) {
      if (!this.canEditRows()) return;
      const where = {};
      this.explorePrimaryKey.forEach((pk) => { where[pk] = row[pk]; });
      this.exploreRowModal = { open: true, mode: 'edit', where, values: { ...row }, saving: false, error: '' };
    },
    openInsertRow() {
      const blank = {};
      this.exploreResultColumns.forEach((c) => { blank[c] = ''; });
      this.exploreRowModal = { open: true, mode: 'insert', where: null, values: blank, saving: false, error: '' };
    },
    async saveExploreRow() {
      this.exploreRowModal.saving = true; this.exploreRowModal.error = '';
      const base = `/api/explore/${this.exploreConnKey}/${encodeURIComponent(this.exploreDatabase)}/${encodeURIComponent(this.exploreTable)}/rows`;
      try {
        let res;
        if (this.exploreRowModal.mode === 'edit') {
          res = await fetch(base, {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ where: this.exploreRowModal.where, changes: this.exploreRowModal.values })
          });
        } else {
          res = await fetch(base, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ values: this.exploreRowModal.values })
          });
        }
        const data = await res.json();
        if (!res.ok) { this.exploreRowModal.error = data.error || 'Save failed'; return; }
        this.exploreRowModal.open = false;
        await this.loadExploreRows();
        this.showToast(this.exploreRowModal.mode === 'edit' ? 'Row updated' : 'Row added');
      } catch (e) {
        this.exploreRowModal.error = 'Network error, please try again';
      } finally {
        this.exploreRowModal.saving = false;
      }
    },
    async deleteExploreRow(row) {
      if (!this.canEditRows()) return;
      const ok = await this.askConfirm('Delete this row?', 'This cannot be undone.', { confirmLabel: 'Delete', danger: true });
      if (!ok) return;
      const where = {};
      this.explorePrimaryKey.forEach((pk) => { where[pk] = row[pk]; });
      try {
        const base = `/api/explore/${this.exploreConnKey}/${encodeURIComponent(this.exploreDatabase)}/${encodeURIComponent(this.exploreTable)}/rows`;
        const res = await fetch(base, {
          method: 'DELETE', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ where })
        });
        const data = await res.json();
        if (!res.ok) { this.showToast(data.error || 'Delete failed', 'error'); return; }
        this.showToast('Row deleted');
        await this.loadExploreRows();
      } catch (e) {
        this.showToast('Network error, please try again', 'error');
      }
    },

    // ---- CSV export (client-side, from data already loaded) ----
    csvFieldClient(v) {
      if (v === null || v === undefined) return '';
      const str = typeof v === 'object' ? JSON.stringify(v) : String(v);
      return /[",\n\r]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
    },
    downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    },
    exportStatementCsv(s) {
      if (!s.columns || !s.rows) return;
      const lines = [s.columns.map(this.csvFieldClient).join(',')];
      for (const row of s.rows) lines.push(s.columns.map((c) => this.csvFieldClient(row[c])).join(','));
      const blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
      this.downloadBlob(blob, 'query-result.csv');
    },

    // ---- Explore: CSV export of a full table (server-streamed download) ----
    tableExportUrl() {
      if (!this.exploreConnKey || !this.exploreDatabase || !this.exploreTable) return '#';
      const params = new URLSearchParams();
      if (this.exploreSortCol) { params.set('sortCol', this.exploreSortCol); params.set('sortDir', this.exploreSortDir); }
      const qs = params.toString();
      const base = `/api/explore/${this.exploreConnKey}/${encodeURIComponent(this.exploreDatabase)}/${encodeURIComponent(this.exploreTable)}/export.csv`;
      return qs ? `${base}?${qs}` : base;
    },

    // ---- Explore: CSV import ----
    openImportModal() {
      this.importModal = { open: true, step: 'pick', file: null, previewFields: [], previewRows: [], mapping: {}, truncate: false, imported: 0, failedBatches: 0, running: false, error: '' };
    },
    availableTargetColumns() {
      return this.exploreResultColumns.length ? this.exploreResultColumns : this.exploreColumns.map((c) => c.name);
    },
    onImportFileSelected(event) {
      const file = event.target.files[0];
      if (!file) return;
      this.importModal.file = file;
      this.importModal.error = '';
      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        preview: 5,
        complete: (results) => {
          const fields = results.meta.fields || [];
          const targetCols = this.availableTargetColumns();
          const mapping = {};
          fields.forEach((f) => {
            const match = targetCols.find((tc) => tc.toLowerCase() === f.toLowerCase());
            mapping[f] = match || '__skip__';
          });
          this.importModal.previewFields = fields;
          this.importModal.previewRows = results.data;
          this.importModal.mapping = mapping;
          this.importModal.step = 'mapping';
        },
        error: (err) => { this.importModal.error = 'Failed to read CSV: ' + err.message; }
      });
    },
    async startImport() {
      if (this.importModal.truncate) {
        const ok = await this.askConfirm(
          'Truncate table before import?',
          `All existing rows in "${this.exploreTable}" will be permanently deleted before the import runs.`,
          { confirmLabel: 'Truncate & import', danger: true }
        );
        if (!ok) return;
      }

      this.importModal.step = 'importing';
      this.importModal.running = true;
      this.importModal.imported = 0;
      this.importModal.failedBatches = 0;
      this.importModal.error = '';

      const mapping = this.importModal.mapping;
      const uniqueTargetCols = [...new Set(Object.values(mapping).filter((v) => v !== '__skip__'))];
      const BATCH_SIZE = 500;
      let buffer = [];
      let isFirstBatch = true;

      const sendBatch = async (rows) => {
        if (rows.length === 0) return;
        const mappedRows = rows.map((r) => {
          const out = {};
          for (const [csvCol, targetCol] of Object.entries(mapping)) {
            if (targetCol === '__skip__') continue;
            out[targetCol] = r[csvCol];
          }
          return out;
        });
        try {
          const url = `/api/explore/${this.exploreConnKey}/${encodeURIComponent(this.exploreDatabase)}/${encodeURIComponent(this.exploreTable)}/import`;
          const res = await fetch(url, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ columns: uniqueTargetCols, rows: mappedRows, truncate: isFirstBatch && this.importModal.truncate })
          });
          const data = await res.json();
          if (!res.ok) { this.importModal.failedBatches++; this.importModal.error = data.error || 'Import batch failed'; }
          else { this.importModal.imported += data.affectedRows || mappedRows.length; }
        } catch (e) {
          this.importModal.failedBatches++;
          this.importModal.error = 'Network error during import';
        }
        isFirstBatch = false;
      };

      await new Promise((resolve) => {
        Papa.parse(this.importModal.file, {
          header: true,
          skipEmptyLines: true,
          worker: false,
          step: (results, parser) => {
            buffer.push(results.data);
            if (buffer.length >= BATCH_SIZE) {
              parser.pause();
              const batch = buffer.splice(0);
              sendBatch(batch).then(() => parser.resume());
            }
          },
          complete: async () => {
            if (buffer.length) await sendBatch(buffer.splice(0));
            resolve();
          },
          error: (err) => {
            this.importModal.error = 'Failed to parse CSV: ' + err.message;
            resolve();
          }
        });
      });

      this.importModal.running = false;
      this.importModal.step = 'done';
      await this.loadExploreRows();
      this.showToast(
        `Imported ${this.importModal.imported} row(s)` + (this.importModal.failedBatches ? ` — ${this.importModal.failedBatches} batch error(s)` : ''),
        this.importModal.failedBatches ? 'error' : 'success'
      );
    },

    // ---- Explore: Backup / Restore ----
    backupUrl() {
      if (!this.exploreConnKey || !this.exploreDatabase) return '#';
      return `/api/explore/${this.exploreConnKey}/${encodeURIComponent(this.exploreDatabase)}/backup.tar.gz`;
    },
    openRestoreModal() {
      this.restoreModal = { open: true, file: null, running: false, done: false, progress: { executed: 0, failed: 0 }, errors: [], error: '' };
    },
    onRestoreFileSelected(event) {
      this.restoreModal.file = event.target.files[0] || null;
    },
    async startRestore() {
      if (!this.restoreModal.file) return;
      const isTarGz = /\.(tar\.gz|tgz|gz)$/i.test(this.restoreModal.file.name);
      const ok = await this.askConfirm(
        'Restore this backup?',
        `This runs the uploaded ${isTarGz ? '.tar.gz' : '.sql'} file against "${this.exploreDatabase}". Existing tables with matching names will be dropped and recreated. This cannot be undone.`,
        { confirmLabel: 'Restore', danger: true }
      );
      if (!ok) return;

      this.restoreModal.running = true;
      this.restoreModal.error = '';
      this.restoreModal.progress = { executed: 0, failed: 0 };
      this.restoreModal.done = false;

      try {
        const format = isTarGz ? 'targz' : 'sql';
        const url = `/api/explore/${this.exploreConnKey}/${encodeURIComponent(this.exploreDatabase)}/restore?format=${format}`;
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/octet-stream' },
          body: this.restoreModal.file
        });
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            if (!line.trim()) continue;
            const evt = JSON.parse(line);
            if (evt.type === 'progress') this.restoreModal.progress = evt;
            else if (evt.type === 'done') { this.restoreModal.progress = evt; this.restoreModal.errors = evt.errors || []; this.restoreModal.done = true; }
            else if (evt.type === 'error') { this.restoreModal.error = evt.error; }
          }
        }
      } catch (e) {
        this.restoreModal.error = 'Network error during restore';
      } finally {
        this.restoreModal.running = false;
        this.restoreModal.done = true;
        await this.loadExploreTables();
        this.showToast(this.restoreModal.error ? 'Restore failed' : 'Restore finished', this.restoreModal.error ? 'error' : 'success');
      }
    },

    async logout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login';
    }
  };
}
</script>
</body>
</html>
